name: Build project workflow

on:
  push

permissions:
  contents: read

jobs:
  build:
    name: Build project job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Tag Docker image
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ivt24/leveryev
      #   id: meta

      - name: Login in AWS ECR
        uses: docker/login-action@v4
        with:
          registry: 496008581975.dkr.ecr.eu-west-3.amazonaws.com
          username: ${{ vars.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and push Docker image to AWS ECR
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 496008581975.dkr.ecr.eu-west-3.amazonaws.com/ivt24/leveryev
